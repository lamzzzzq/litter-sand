<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>猫砂盆 · 砂的物理</title>
<link rel="stylesheet" href="style.css?v=1.7">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <div class="row">
    <b>猫砂盆 · 砂</b>
    <span id="fps" class="sub"></span>
  </div>
  <div class="row">
    <span class="lbl">砂</span>
    <button data-litter="bentonite" class="on">膨润土</button>
    <button data-litter="tofu">豆腐砂</button>
    <button data-litter="crystal">水晶砂</button>
    <button data-litter="pine">松木砂</button>
  </div>
  <div class="row">
    <span class="lbl">猫</span><select id="cat"><option value="granny">阿婆（老猫：尿团多、偶尔不埋）</option><option value="orange">小橘（贪吃：稀屎多）</option><option value="coal">煤球（洁癖：埋得深）</option><option value="kitten">幼猫（小坨、没埋、可能有虫）</option><option value="stray">流浪猫（全不埋）</option></select>
  </div>
  <div class="row">
    <span class="lbl">手</span>
    <button data-tool="scoop" class="on">猫砂铲</button><button data-tool="lift">双手端盆</button><button data-tool="press">指压</button>
    <button data-tool="pour">倒砂</button>
    <button data-tool="smooth">抹平</button>
    <span class="lbl">大小</span><input id="size" type="range" min="1" max="8" step="0.5" value="3">
  </div>
  <div class="row hint"><button id="reset" class="ghost">重置</button> <button id="flat" class="ghost">全盆抹平</button> <button id="bury" class="ghost">这只猫再来一坨</button> <button id="home" class="ghost">回默认视角</button></div>
</div>
<div id="hud"><span id="coinIcon">🪙</span><span id="coinNum">0</span></div>
<canvas id="cv"></canvas>
<script type="module" src="sand.js?v=1.7"></script>
</body>
</html>
