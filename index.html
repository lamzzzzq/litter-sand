<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>猫砂盆 · 砂的物理</title>
<link rel="stylesheet" href="style.css?v=0.1.0">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <div class="row">
    <b>猫砂盆 · 砂</b><span class="sub">v0.1 · 第一阶段只做砂</span>
    <span id="fps" class="sub"></span>
  </div>
  <div class="row">
    <span class="lbl">砂</span>
    <button data-litter="bentonite" class="on">膨润土</button>
    <button data-litter="tofu">豆腐砂</button>
    <button data-litter="crystal">水晶砂</button>
    <button data-litter="pine">松木砂</button>
  </div>
  <div class="row">
    <span class="lbl">手</span>
    <button data-tool="press" class="on">指压 / 铲刃</button>
    <button data-tool="pour">倒砂</button>
    <button data-tool="smooth">抹平</button>
    <span class="lbl">大小</span><input id="size" type="range" min="1" max="8" step="0.5" value="3">
  </div>
  <div class="row hint">左键按住拖 = 用手 · 右键拖 = 转视角 · 滚轮 = 远近 · <button id="reset" class="ghost">重置</button> <button id="flat" class="ghost">全盆抹平</button></div>
</div>
<canvas id="cv"></canvas>
<script type="module" src="sand.js?v=0.1.0"></script>
</body>
</html>
